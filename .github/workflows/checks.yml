name: Bootstrap checks
on:
  push:
    branches: [main, bootstrap/maipa-workspace, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.13.15
          architecture: x64
      - name: Install approved locked closure without lifecycle scripts
        run: ./tools/bootstrap.ps1
      - name: Shared alignment-first and browser-last pipeline
        run: .venv/Scripts/python.exe -m tools.ci
      - name: Candidate evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-evidence-${{ github.sha }}
          path: artifacts/ci/report.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
